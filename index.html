<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Netlify Deploy FIX</title>
</head>
<body>

<h3>Deploy ke Netlify (FIX)</h3>

<textarea id="html" style="width:100%;height:120px;">
<h1>HELLO NETLIFY FIX</h1>
</textarea>

<button onclick="deploy()">DEPLOY</button>

<input id="out" style="width:100%;margin-top:10px">

<script>
async function deploy() {
  const html = document.getElementById('html').value;

  const res = await fetch('/api/deploy-netlify', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      files: {
        "index.html": html
      }
    })
  });

  const text = await res.text();
  try {
    const data = JSON.parse(text);
    document.getElementById('out').value = data.url || text;
  } catch {
    alert(text);
  }
}
</script>

</body>
</html>
