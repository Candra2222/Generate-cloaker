<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Netlify Auto Deploy</title>
<style>
body {
  background:#111;
  color:#fff;
  font-family:Arial;
  padding:20px;
}
.box {
  max-width:450px;
  margin:auto;
  background:#1f1f1f;
  padding:20px;
  border-radius:12px;
}
button {
  width:100%;
  padding:12px;
  background:#00dc82;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
textarea {
  width:100%;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="box">
  <h3>Deploy ke Netlify</h3>

  <input type="file" id="files" multiple>
  <button onclick="deploy()">DEPLOY</button>

  <textarea id="result" placeholder="URL hasil deploy"></textarea>
</div>

<script>
async function deploy() {
  const input = document.getElementById('files');
  const files = {};

  for (const f of input.files) {
    files[f.name] = await f.text();
  }

  const res = await fetch('/api/deploy-netlify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ files })
  });

  const data = await res.json();
  document.getElementById('result').value =
    data.url || JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
