<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Netlify Deploy Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  min-height: 100vh;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.container {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border-radius: 14px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

h3 {
  text-align: center;
  margin-bottom: 15px;
}

textarea {
  width: 100%;
  height: 140px;
  border-radius: 10px;
  border: none;
  padding: 12px;
  resize: none;
  outline: none;
  font-size: 14px;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-1px);
}

.deploy {
  background: #00c853;
  color: #000;
}

.copy {
  background: #2979ff;
  color: #fff;
  display: none;
}

input {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 13px;
}

.footer {
  position: fixed;
  bottom: 10px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="container">
  <h3>🚀 Netlify Deploy Tool</h3>

  <textarea id="html">
<h1>HELLO NETLIFY FIX</h1>
<p>Deploy sukses 🚀</p>
  </textarea>

  <button class="deploy" onclick="deploy()">DEPLOY</button>

  <input id="out" readonly placeholder="URL akan muncul di sini">

  <button class="copy" id="copyBtn" onclick="copyLink()">SALIN LINK</button>
</div>

<div class="footer">
  tools by sesepuh 2026
</div>

<script>
async function deploy() {
  const html = document.getElementById('html').value;
  const out = document.getElementById('out');
  const copyBtn = document.getElementById('copyBtn');

  out.value = 'Deploying...';
  copyBtn.style.display = 'none';

  const res = await fetch('/api/deploy-netlify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      files: {
        "index.html": html
      }
    })
  });

  const text = await res.text();

  try {
    const data = JSON.parse(text);
    if (data.url) {
      out.value = data.url;
      copyBtn.style.display = 'block';
    } else {
      out.value = text;
    }
  } catch {
    out.value = text;
  }
}

function copyLink() {
  const out = document.getElementById('out');
  out.select();
  document.execCommand('copy');
  alert('Link berhasil disalin!');
}
</script>

</body>
</html>
